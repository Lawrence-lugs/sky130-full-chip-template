meta:
  version: 0
  flow: Classic
  substituting_steps:
    Netgen.LVS: null # Still debugging DRC.

    OpenROAD.STAMidPNR: null # Skip to save time
    OpenROAD.STAPrePNR: null # Skip to save time

    # THE FOLLOWING ARE ALSO SKIPPED IN CARAVEL AND OPENFRAME
    # We'll run fillgen as a script later, then DRC again. 
    OpenROAD.FillInsertion: null # Inserting fills not needed yet, too heavy
    OpenROAD.TapEndcapInsertion: null # Pad ports too close together
    Odb.DiodesOnPorts: null # Pad ports too close together
    OpenROAD.CTS: null # No need if the core is a hardened macro

    Checker.YosysSynthChecks: null # This causes errors when unused pins are not tied off.
    # but we can't tie pins off to 1 or 0 because they cause DRC errors 
    # in openframe or caravel they tie pads off using loopback `caravel/verilog/gl/constant_blocks.v`
    # there's also a constant_block.def that describes it, so it's a custom macro used in their padring.

DESIGN_NAME: "core_wrapper"

VERILOG_FILES: 
- "dir::src/core_wrapper.sv" # Core wrapper instantiates core and the inouts are the pad-side

# Floorplan
FP_SIZING: absolute
DIE_AREA:  [   0.00,   0.00, 2000.00, 2000.00 ]
CORE_AREA: [ 250, 250, 1750, 1750 ]
FP_DEF_TEMPLATE: "dir::outputs/chip_io_template.def" # Floorplan from padring design

# Core Files. Replace with the output files from your core design flow.
MACROS:
  regfile:
    nl:
    - "dir::../register_files/outputs/pnl/regfile.pnl.v"
    lef:
    - "dir::../register_files/outputs/lef/regfile.lef"
    gds:
    - "dir::../register_files/outputs/gds/regfile.gds"
    spef:
      "nom_*":
        - "dir::../register_files/outputs/spef/nom/regfile.nom.spef"
    instances:
      u_regfile:
        location: [400, 400]
        orientation: N

# Power Distribution
# FP_PDN_CFG: "dir::pdn_cfg.tcl" # Custom PDN config for most full-chip integrations
VDD_NETS:
  - vccd
GND_NETS:
  - vssd

VERILOG_POWER_DEFINE: USE_POWER_PINS
FP_PDN_CORE_RING: 1
FP_PDN_CORE_RING_VWIDTH: 20
FP_PDN_CORE_RING_HWIDTH: 20
FP_PDN_CORE_RING_VOFFSET: -4
FP_PDN_CORE_RING_HOFFSET: -4
FP_PDN_CORE_RING_VSPACING: 2.4
FP_PDN_CORE_RING_HSPACING: 2.4
FP_PDN_VWIDTH: 6.4
FP_PDN_HWIDTH: 6.4
FP_PDN_HSPACING: 3.2
FP_PDN_VSPACING: 3.2